[project]
name = "ai-mailbox-manager"
version = "0.1.0"
description = "Local-first Outlook add-in backend for AI Mailbox Manager"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "langgraph>=0.2.0",
  "python-dateutil>=2.9.0",
  "msal>=1.28.0"
]

[project.optional-dependencies]
test = ["pytest>=8.2.0", "pytest-asyncio>=0.23.0"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/app/tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
